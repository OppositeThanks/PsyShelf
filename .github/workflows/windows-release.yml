name: Build Windows executable

on:
  workflow_dispatch:
  pull_request:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install pnpm
        run: npm install --global pnpm@10.15.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Verify release tag matches package version
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          if ("${{ github.ref_name }}" -ne "v$version") {
            throw "Tag ${{ github.ref_name }} does not match package version $version. Expected v$version."
          }

      - name: Build Windows installer
        run: pnpm run dist:win

      - name: Verify and checksum executable
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $exe = "dist/PsyShelf-Setup-$version-Windows.exe"
          if (-not (Test-Path -LiteralPath $exe)) {
            throw "Expected build output was not created: $exe"
          }
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $exe).Hash.ToLowerInvariant()
          "$hash  PsyShelf-Setup-$version-Windows.exe" | Set-Content -Encoding ascii "$exe.sha256"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: PsyShelf-${{ github.run_number }}-Windows
          path: |
            dist/PsyShelf-Setup-*-Windows.exe
            dist/PsyShelf-Setup-*-Windows.exe.sha256
          if-no-files-found: error

  publish-release:
    if: github.ref_type == 'tag'
    needs: build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download built files
        uses: actions/download-artifact@v4
        with:
          name: PsyShelf-${{ github.run_number }}-Windows
          path: dist

      - name: Publish GitHub Release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            "dist/PsyShelf-Setup-*-Windows.exe" `
            "dist/PsyShelf-Setup-*-Windows.exe.sha256" `
            --verify-tag `
            --generate-notes `
            --title "PsyShelf ${{ github.ref_name }}"
