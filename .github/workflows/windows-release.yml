name: Build Windows executable

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - "main"
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows:
    runs-on: windows-latest

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install pnpm
        run: npm install --global pnpm@10.15.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Verify release tag matches package version
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          if ("${{ github.ref_name }}" -ne "v$version") {
            throw "Tag ${{ github.ref_name }} does not match package version $version. Expected v$version."
          }

      - name: Set build version
        id: version
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          if ("${{ github.ref_type }}" -ne "tag") {
            $parts = $version.Split('.')
            $version = "$($parts[0]).$($parts[1]).${{ github.run_number }}"
            npm pkg set "version=$version"
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Build Windows installer
        run: pnpm run dist:win

      - name: Verify and checksum executable
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $exe = "dist/PsyShelf-Setup-$version-Windows.exe"
          if (-not (Test-Path -LiteralPath $exe)) {
            throw "Expected build output was not created: $exe"
          }
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $exe).Hash.ToLowerInvariant()
          "$hash  PsyShelf-Setup-$version-Windows.exe" | Set-Content -Encoding ascii "$exe.sha256"
          Copy-Item -LiteralPath $exe -Destination "dist/PsyShelf-Setup-Windows.exe"
          "$hash  PsyShelf-Setup-Windows.exe" | Set-Content -Encoding ascii "dist/PsyShelf-Setup-Windows.exe.sha256"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: PsyShelf-${{ github.run_number }}-Windows
          path: |
            dist/PsyShelf-Setup-*-Windows.exe
            dist/PsyShelf-Setup-*-Windows.exe.sha256
            dist/PsyShelf-Setup-Windows.exe
            dist/PsyShelf-Setup-Windows.exe.sha256
          if-no-files-found: error

  publish-release:
    if: github.ref_type == 'tag' || (github.ref == 'refs/heads/main' && github.event_name != 'pull_request')
    needs: build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download built files
        uses: actions/download-artifact@v4
        with:
          name: PsyShelf-${{ github.run_number }}-Windows
          path: dist

      - name: Publish GitHub Release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          @'
          ## Install PsyShelf on Windows

          Download **PsyShelf-Setup-Windows.exe** below and double-click it. Setup installs PsyShelf for your Windows user, creates desktop and Start menu shortcuts, and opens the app. No ZIP extraction or separate Node.js installation is needed.

          After setup finishes, you can delete the downloaded installer. Open PsyShelf from its shortcut thereafter. Uninstall through Settings > Apps > Installed apps.

          The versioned installer is an identical copy. You only need one .exe; checksum files and GitHub's source-code archives are optional and are not needed to install the app. Local AI features require the separate Ollama setup described in the app.
          '@ | Set-Content -Encoding utf8 release-notes.md
          $tag = "v${{ needs.build-windows.outputs.version }}"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) { exit 0 }
          gh release create $tag `
            "dist/PsyShelf-Setup-*-Windows.exe" `
            "dist/PsyShelf-Setup-*-Windows.exe.sha256" `
            "dist/PsyShelf-Setup-Windows.exe" `
            "dist/PsyShelf-Setup-Windows.exe.sha256" `
            --target "${{ github.sha }}" `
            --latest `
            --notes-file release-notes.md `
            --generate-notes `
            --title "PsyShelf $tag"
          if ($LASTEXITCODE -ne 0) { throw "Release publication failed" }
